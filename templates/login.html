{% extends "layout.html" %}

{% block body %}

<div class="content">
    <section>
        <h2>
            Login
        </h2>
        <form action="/" method="POST" novalidate>
            {{ form.hidden_tag() }}
            <p>
                {{ form.username.label }} <br>
                {{ form.username }}
                {% for error in form.username.errors %}
                <span class="error">
                    {{ error }}
                </span><br>
                {% endfor %}

            </p>

            <p>
                {{ form.submit() }}
            </p>

            <p>
                {{ mailmessage }}
            </p>


        </form>
    </section>
</div>

{% endblock %}
